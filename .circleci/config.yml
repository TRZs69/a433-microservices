version: 2.1

jobs:
  lint-dockerfile:
    machine: true
    steps:
      - checkout
      - run:
          name: Install hadolint
          command: |
            curl -L https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o hadolint
            chmod +x hadolint
      - run:
          name: Lint Dockerfile
          command: ./hadolint Dockerfile

  build-app-karsajobs-ui:
    machine: true
    steps:
      - checkout
      - run:
          name: Login GHCR
          command: |
            echo "$GHCR_PAT" | docker login ghcr.io -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Build Docker image
          command: docker build -t ghcr.io/trzs69/karsajobs-ui:latest .
      - run:
          name: Push Docker image
          command: docker push ghcr.io/trzs69/karsajobs-ui:latest

workflows:
  version: 2
  pipeline:
    jobs:
      - lint-dockerfile
      - build-app-karsajobs-ui:
          requires:
            - lint-dockerfile
