version: 2.1

jobs:
  lint-dockerfile:
    machine: true
    steps:
      - checkout
      - run:
          name: Install hadolint
          command: |
            curl -s https://raw.githubusercontent.com/hadolint/hadolint/master/install.sh | bash
      - run:
          name: Lint Dockerfile
          command: ./hadolint Dockerfile

  build-app-karsajobs-ui:
    machine: true
    steps:
      - checkout
      - run:
          name: Docker login GHCR
          command: |
            echo "$GHCR_PAT" | docker login ghcr.io -u "$DOCKER_USERNAME" --password-stdin

      - run:
          name: Build Docker image
          command: |
            docker build -t ghcr.io/trzs69/karsajobs-ui:latest .

      - run:
          name: Push Docker image
          command: |
            docker push ghcr.io/trzs69/karsajobs-ui:latest

workflows:
  version: 2
  pipeline:
    jobs:
      - lint-dockerfile
      - build-app-karsajobs-ui:
          requires:
            - lint-dockerfile
