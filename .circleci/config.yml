version: 2.1

jobs:
  lint-dockerfile:
    docker:
      - image: hadolint/hadolint:latest
    steps:
      - checkout
      - run:
          name: Lint Dockerfile
          command: hadolint Dockerfile

  build-app-karsajobs-ui:
    docker:
      - image: docker:latest
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Login to GHCR
          command: |
            echo "$GHCR_PAT" | docker login ghcr.io -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Build Docker image
          command: |
            docker build -t ghcr.io/trzs69/karsajobs-ui:latest .
      - run:
          name: Push Docker image
          command: |
            docker push ghcr.io/trzs69/karsajobs-ui:latest

workflows:
  version: 2
  main:
    jobs:
      - lint-dockerfile
      - build-app-karsajobs-ui:
          requires:
            - lint-dockerfile

